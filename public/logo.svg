<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="upaoGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855" />
      <stop offset="100%" stop-color="#001433" />
    </linearGradient>
    <linearGradient id="goldGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="blueGradSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base redondeada elegante azul UPAO -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#upaoGradBg)" />
  <rect x="14" y="14" width="172" height="172" rx="40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Bonete / Birrete Académico UPAO en Oro -->
  <path d="M100 48 L155 75 L100 102 L45 75 Z" fill="url(#goldGradAccent)" filter="url(#glow)" />
  <path d="M60 88 L60 120 C60 135 140 135 140 120 L140 88" fill="none" stroke="url(#goldGradAccent)" stroke-width="7" stroke-linecap="round" />

  <!-- Borla dorada de graduación -->
  <circle cx="155" cy="75" r="4" fill="#FFFFFF" />
  <path d="M155 75 L165 105" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

  <!-- Destellos IA en azul tecnológico -->
  <path d="M100 138 L103 148 L113 151 L103 154 L100 164 L97 154 L87 151 L97 148 Z" fill="url(#blueGradSpark)" />
  <circle cx="68" cy="151" r="5" fill="#38BDF8" />
  <circle cx="132" cy="151" r="5" fill="#38BDF8" />
  <line x1="73" y1="151" x2="87" y2="151" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="3,3" />
  <line x1="113" y1="151" x2="127" y2="151" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="3,3" />
</svg>
