<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="upaoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002855" />
      <stop offset="100%" stop-color="#004080" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="techSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3182CE" />
      <stop offset="100%" stop-color="#002855" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Transparente con Círculo / Escudo Suave para Integración Total -->
  <circle cx="100" cy="100" r="90" fill="url(#upaoBrandGrad)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

  <!-- Bonete Académico UPAO en Oro Pulido -->
  <path d="M100 45 L158 74 L100 103 L42 74 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
  <path d="M58 87 L58 120 C58 135 142 135 142 120 L142 87" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Borla de Graduación -->
  <circle cx="158" cy="74" r="4.5" fill="#FFFFFF" />
  <path d="M158 74 L168 106" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Red de Nodos de Inteligencia Artificial (Matching con el tema azul) -->
  <path d="M100 138 L103 148 L113 151 L103 154 L100 164 L97 154 L87 151 L97 148 Z" fill="#6366F1" />
  <circle cx="66" cy="151" r="5" fill="#60A5FA" />
  <circle cx="134" cy="151" r="5" fill="#60A5FA" />
  <line x1="71" y1="151" x2="87" y2="151" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="3,3" />
  <line x1="113" y1="151" x2="129" y2="151" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="3,3" />
</svg>
